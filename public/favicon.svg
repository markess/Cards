  <!-- Front Card Header Line -->
  <rect x="24" y="18" width="16" height="3" rx="1.5" fill="#ffffff" fill-opacity="0.9"/>
  
  <!-- Star / Sparkle Icon in Center -->
  <path d="M37 25 C37 30 31 33 31 33 C31 33 37 36 37 41 C37 36 43 33 43 33 C43 33 37 30 37 25 Z" fill="#fbbf24"/>
  
  <!-- Card Text Placeholder Lines -->
  <rect x="24" y="44" width="24" height="3" rx="1.5" fill="#e0e7ff" fill-opacity="0.85"/>
  <rect x="24" y="49" width="15" height="2.5" rx="1.25" fill="#c7d2fe" fill-opacity="0.6"/>
</svg>
